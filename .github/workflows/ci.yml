name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Amazon RDS admin is not a true superuser: prove migrations apply as a plain CREATEROLE user.
      - name: Migrations apply as a non-superuser (RDS-like)
        run: |
          psql postgres://postgres:postgres@127.0.0.1:5432/postgres -c "CREATE ROLE rds_admin LOGIN PASSWORD 'x' CREATEROLE CREATEDB" -c "CREATE DATABASE rds_sim OWNER rds_admin"
          MIGRATION_DATABASE_URL=postgres://rds_admin:x@127.0.0.1:5432/rds_sim APP_DB_PASSWORD=a WORKER_DB_PASSWORD=w \
            pnpm --filter @eureka/api exec tsx src/db/migrate.ts
      # Unit tests, SRS golden expectations, RLS/differential and API authorization matrix
      - run: pnpm -r test
      - name: Grants table in docs is up to date
        run: |
          pnpm -s docs:grants > /tmp/grants.md
          grep -F -f <(head -3 /tmp/grants.md) docs/design.md > /dev/null

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          set -uo pipefail
          # Terragrunt generates provider.tf at deploy time; mirror it here so the
          # aliased us_east_1 provider resolves when the module is validated alone.
          cat > infra/modules/stack/provider_ci.tf <<'TF'
          provider "aws" { region = "us-east-2" }
          provider "aws" {
            alias  = "us_east_1"
            region = "us-east-1"
          }
          TF
          rc=0
          for dir in infra/modules/stack infra/bootstrap; do
            terraform -chdir=$dir init -backend=false -input=false >/dev/null || { echo "::error::init failed in $dir"; rc=1; continue; }
            terraform -chdir=$dir validate -json > /tmp/v.json || true
            jq -r --arg d "$dir" '.diagnostics[]? | "::\(.severity) file=\($d)/\(.range.filename // ""),line=\(.range.start.line // 1)::\(.summary): \(.detail // "")"' /tmp/v.json
            jq -e '.valid' /tmp/v.json >/dev/null || rc=1
          done
          exit $rc
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          config_file: infra/.checkov.yaml
          framework: terraform

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: eureka-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and loads the compiled app
        run: |
          test "$(docker run --rm eureka-api:ci id -u)" = "10001"
          docker run --rm eureka-api:ci node -e "import('@eureka/shared').then(m=>{if(!m.ROLES)process.exit(1)})"
