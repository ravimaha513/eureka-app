# OWASP ZAP baseline scan (launch check; implementation plan Phase 2 exit
# criteria). Manual only: Actions -> zap-baseline -> Run workflow, with the
# URL of a running stack (staging, or production for the final check). The
# baseline is passive: it spiders the site and inspects responses; it sends
# no attack payloads. Rules and their FAIL/WARN/IGNORE levels: .zap/rules.tsv.
name: zap-baseline
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL to scan, e.g. https://eureka-staging.spokenly.click"
        required: true
        type: string
      ajax_spider:
        description: "Also run the AJAX spider (the web app is a single-page app)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check target URL
        env:
          TARGET: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/.*)?$ ]]; then
            echo "::error::target_url must be an http(s) URL"
            exit 1
          fi
          curl -fsS -o /dev/null --max-time 20 "$TARGET" || { echo "::error::$TARGET is not reachable"; exit 1; }

      - uses: actions/checkout@v7

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: .zap/rules.tsv
          # -a: include alpha passive rules; -I: only FAIL rules fail the job (WARN is reported);
          # -j: AJAX spider for the SPA routes.
          cmd_options: ${{ inputs.ajax_spider && '-a -I -j' || '-a -I' }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
