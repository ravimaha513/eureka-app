# Accepted Checkov findings, each with a reason. Everything else must pass.
framework: [terraform]
skip-check:
  # Standard KMS key policy: account root administers the key; "*" means "this key".
  - CKV_AWS_109
  - CKV_AWS_111
  - CKV_AWS_356
  # Log4j: not a Java stack; AWSManagedRulesKnownBadInputsRuleSet (enabled) already includes Log4JRCE.
  - CKV_AWS_192
  - CKV2_AWS_47
  # Single S3 origin for the SPA; failover not needed at this scale.
  - CKV_AWS_310
  # Cross-region replication: RDS snapshots are copied cross-region (design A8); audit bucket replication in Phase 5.
  - CKV_AWS_144
  # Only the documents bucket needs events (GuardDuty scan results); others do not.
  - CKV2_AWS_62
  # Audit (Object Lock retention) and state buckets intentionally have no expiry lifecycle.
  - CKV2_AWS_61
  # Bootstrap state bucket: access logging not required (CloudTrail data events cover it).
  - CKV_AWS_18
  # AZ list is sliced to the first two; new AZs do not change placement.
  - CKV_AWS_394

  # ---- Cost trade-offs (infra/README.md "Cost"); revisit when usage grows ----
  # Container Insights bills per-task custom metrics; basic ECS metrics suffice.
  - CKV_AWS_65
  # Log groups use CloudWatch's default encryption instead of a $1/month CMK;
  # the app never logs restricted fields or document contents.
  - CKV_AWS_158
  # API tasks get a public IP for egress instead of a NAT gateway (~$33/month);
  # inbound is limited to the API Gateway VPC link security group.
  - CKV_AWS_333
  # Authentication and authorization are enforced by the app (session, RBAC, RLS);
  # the API Gateway route only forwards, and the app rejects requests without the
  # CloudFront origin secret.
  - CKV_AWS_309
  # RDS Performance Insights and Enhanced Monitoring are paid add-ons; basic
  # CloudWatch metrics and the postgresql log export (slow queries) remain.
  - CKV_AWS_353
  - CKV_AWS_118
  # CloudFront access logs and WAF request logs are off (WAF logs need a paid
  # CloudFront plan); API Gateway access logs and the app audit log cover requests.
  - CKV_AWS_86
  - CKV2_AWS_31
